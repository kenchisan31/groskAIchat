<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Chat</title>
<style>
  :root{
    --bg:#eef2f6; --panel:#ffffff; --ink:#18212b; --muted:#66727f; --line:#d9e0e7;
    --me:#1f4fd8; --me-ink:#fff; --bot:#e6ebf1; --code:#13202e; --code-ink:#e3edf7;
  }
  @media (prefers-color-scheme:dark){
    :root{--bg:#0f151c; --panel:#161e27; --ink:#e4eaf0; --muted:#8c98a5; --line:#26313d;
      --me:#3b6cf0; --bot:#1f2a36; --code:#0b1118;}
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;justify-content:center}
  .app{width:100%;max-width:820px;height:100%;display:flex;flex-direction:column;background:var(--panel);border-inline:1px solid var(--line)}
  header{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line)}
  header h1{font-size:17px;margin:0;flex:1;font-weight:650}
  header small{display:block;font-size:12px;color:var(--muted);font-weight:400}
  button,textarea{font:inherit;color:inherit}
  .ghost{background:none;border:1px solid var(--line);border-radius:8px;padding:6px 12px;cursor:pointer}
  .ghost:hover{background:var(--bg)}
  :focus-visible{outline:2px solid var(--me);outline-offset:2px}
  #log{flex:1;overflow-y:auto;padding:20px 16px;display:flex;flex-direction:column;gap:14px}
  .row{display:flex;flex-direction:column;max-width:86%}
  .row.user{align-self:flex-end;align-items:flex-end}
  .row.assistant{align-self:flex-start;align-items:flex-start}
  .row.error{align-self:center;max-width:94%}
  .msg{padding:10px 14px;border-radius:14px;white-space:pre-wrap;overflow-wrap:anywhere}
  .user .msg{background:var(--me);color:var(--me-ink);border-bottom-right-radius:4px}
  .assistant .msg{background:var(--bot);border-bottom-left-radius:4px}
  .error .msg{background:#fde8e8;color:#8a1c1c;font-size:14px;text-align:center}
  .time{font-size:11px;color:var(--muted);margin:3px 6px 0}
  .msg pre{background:var(--code);color:var(--code-ink);padding:12px;border-radius:8px;overflow-x:auto;margin:8px 0;white-space:pre;font-size:14px}
  .msg code{font-family:ui-monospace,Consolas,monospace;font-size:.92em}
  .msg :not(pre)>code{background:rgba(120,130,145,.2);padding:1px 5px;border-radius:4px}
  .empty{margin:auto;text-align:center;color:var(--muted);max-width:340px}
  .empty b{display:block;color:var(--ink);font-size:18px;margin-bottom:6px}
  form{display:flex;gap:8px;padding:12px 16px;border-top:1px solid var(--line);align-items:flex-end}
  textarea{flex:1;resize:none;max-height:160px;min-height:44px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
  #send{background:var(--me);color:#fff;border:0;border-radius:10px;padding:0 18px;height:44px;cursor:pointer;font-weight:600}
  #send.stop{background:#b42318}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>AI Chat<small id="clock"></small></h1>
    <button class="ghost" id="clearBtn" type="button">New chat</button>
  </header>
  <div id="log" aria-live="polite"></div>
  <form id="form">
    <textarea id="input" rows="1" placeholder="Type a message… (Enter to send, Shift+Enter for a new line)"></textarea>
    <button id="send" type="submit">Send</button>
  </form>
</div>

<script>
const TZ = 'America/Los_Angeles'; // California time
const $ = id => document.getElementById(id);
const log = $('log'), input = $('input'), sendBtn = $('send');
let history = [];
try { history = JSON.parse(localStorage.getItem('chat_hist_en') || '[]'); } catch {}
let controller = null;
const saveHist = () => { try { localStorage.setItem('chat_hist_en', JSON.stringify(history)); } catch {} };

const fmt = ts => new Date(ts).toLocaleTimeString('en-US', { timeZone:TZ, hour:'numeric', minute:'2-digit', timeZoneName:'short' });
function tickClock(){
  $('clock').textContent = 'California time: ' + new Date().toLocaleString('en-US', { timeZone:TZ, weekday:'short', month:'short', day:'numeric', hour:'numeric', minute:'2-digit', timeZoneName:'short' });
}
tickClock(); setInterval(tickClock, 30000);

function esc(s){ return s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function render(text){
  return text.split(/```/).map((p,i) => {
    if (i % 2) return '<pre><code>' + esc(p.replace(/^[^\n]*\n/, '').replace(/\n$/,'')) + '</code></pre>';
    return esc(p).replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
  }).join('');
}
function addMsg(role, text, ts){
  const row = document.createElement('div');
  row.className = 'row ' + role;
  const el = document.createElement('div');
  el.className = 'msg';
  if (role === 'assistant') el.innerHTML = render(text); else el.textContent = text;
  row.appendChild(el);
  if (ts) { const t = document.createElement('div'); t.className = 'time'; t.textContent = fmt(ts); row.appendChild(t); }
  log.appendChild(row);
  log.scrollTop = log.scrollHeight;
  return { row, el };
}
function redraw(){
  log.innerHTML = '';
  if (!history.length) { log.innerHTML = '<div class="empty"><b>Ask me anything</b>Type a message below to start chatting.</div>'; return; }
  history.forEach(m => addMsg(m.role, m.content, m.ts));
}
function setBusy(b){
  sendBtn.textContent = b ? 'Stop' : 'Send';
  sendBtn.classList.toggle('stop', b);
  sendBtn.type = b ? 'button' : 'submit';
}

async function send(text){
  if (log.querySelector('.empty')) log.innerHTML = '';
  history.push({ role:'user', content:text, ts:Date.now() });
  addMsg('user', text, Date.now());
  const bot = addMsg('assistant', '…');
  controller = new AbortController();
  setBusy(true);
  let acc = '';
  try {
    const res = await fetch('/api/chat', {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ messages: history.map(({ role, content }) => ({ role, content })) }),
      signal: controller.signal
    });
    if (!res.ok) {
      let msg = 'Something went wrong (error ' + res.status + '). Please try again.';
      try { msg = (await res.json()).error || msg; } catch {}
      throw new Error(msg);
    }
    const reader = res.body.getReader(), dec = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream:true });
      const lines = buf.split('\n'); buf = lines.pop();
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const data = t.slice(5).trim();
        if (data === '[DONE]') continue;
        try {
          const delta = JSON.parse(data).choices?.[0]?.delta?.content;
          if (delta) { acc += delta; bot.el.innerHTML = render(acc); log.scrollTop = log.scrollHeight; }
        } catch {}
      }
    }
    if (!acc) bot.el.innerHTML = '<i>(The bot sent an empty reply. Please try again.)</i>';
  } catch (e) {
    if (e.name === 'AbortError') { if (!acc) bot.row.remove(); }
    else {
      bot.row.remove();
      addMsg('error', e instanceof TypeError ? "Can't reach the server. Check your internet connection and try again." : e.message);
      if (!acc) { history.pop(); saveHist(); setBusy(false); controller = null; return; }
    }
  }
  if (acc) {
    const ts = Date.now();
    history.push({ role:'assistant', content:acc, ts });
    const t = document.createElement('div'); t.className = 'time'; t.textContent = fmt(ts); bot.row.appendChild(t);
  }
  saveHist(); setBusy(false); controller = null;
}

$('form').addEventListener('submit', e => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text || controller) return;
  input.value = ''; input.style.height = 'auto';
  send(text);
});
sendBtn.addEventListener('click', () => { if (controller) controller.abort(); });
input.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); $('form').requestSubmit(); }
});
input.addEventListener('input', () => { input.style.height = 'auto'; input.style.height = Math.min(input.scrollHeight, 160) + 'px'; });
$('clearBtn').onclick = () => { if (controller) controller.abort(); history = []; saveHist(); redraw(); };
redraw();
</script>
</body>
</html>
